          title: '<span class="profile-title-zh" lang="zh">刘江锐 博士</span> | <span class="profile-title-en" lang="en">Dr. Jiangrui Liu</span>'
          subtitle: |-
            我是<a href="https://cpa.cqu.edu.cn/" target="_blank" rel="noopener noreferrer">重庆大学公共管理学院</a>的一名教师，<a href="https://www.dps.tsinghua.edu.cn/" target="_blank" rel="noopener noreferrer">清华大学政治学</a>博士。我的研究聚焦政治态度与社会观念的变迁，并关注国家—社会关系与公共治理中的认知与评价问题，延伸至比较政治、公共政策、量化方法与计算社会科学，对复杂社会现象进行系统性实证分析。研究兴趣与方向在问题驱动下持续拓展，始终致力于连接微观行为洞察与宏观政治—制度过程，以求对当代社会的治理与变迁形成更恰当的理解。相关成果发表于 *Political Studies*、*European Journal of Health Economics*、*Archives of Sexual Behavior*、*International Political Science Review*、*Studies in Comparative International Development*、*Journal of Asian and African Studies* 等广泛领域的 SSCI 期刊。
          subtitleEn: |-
            I am a faculty member at the School of Public Policy and Administration, <a href="https://english.cqu.edu.cn/" target="_blank" rel="noopener noreferrer">Chongqing University</a>. I received my Ph.D. in Political Science from <a href="https://www.dps.tsinghua.edu.cn/psen/" target="_blank" rel="noopener noreferrer">Tsinghua University</a>. My research lies at the intersection of political attitudes, social change, and governance, with a particular focus on how individual beliefs and preferences evolve across the life course and in response to broader social and institutional transformations. My work also engages with comparative politics and state–society relations, examining how political and institutional contexts shape public attitudes across diverse societies. While my interests continue to evolve, they are united by an effort to bridge micro-level behavioral insights with macro-level political and institutional processes, and to ground the study of governance and social change in contemporary societies more firmly in evidence.<br>
            Methodologically, I primarily draw on large-scale survey data together with quantitative and computational approaches, including tools from computational social science and machine learning, with an emphasis on transparent and replicable analysis. My work has appeared in journals such as *Political Studies*, *European Journal of Health Economics*, *Archives of Sexual Behavior*, *International Political Science Review*, *Studies in Comparative International Development*, and *Journal of Asian and African Studies*.
